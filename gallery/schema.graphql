"""
User and authentication GraphQL schema definitions.
"""
enum UserRole {
  ADMIN
  MODERATOR
  USER
  GUEST
}

type User {
  id: ID!
  username: String!
  email: String!
  role: UserRole!
  posts: [Post!]!
  createdAt: String!
}

type Post {
  id: ID!
  title: String!
  content: String!
  published: Boolean!
  author: User!
}

input CreatePostInput {
  title: String!
  content: String!
  published: Boolean = false
}

type Query {
  me: User
  user(id: ID!): User
  feed(limit: Int = 20, offset: Int = 0): [Post!]!
}

type Mutation {
  createPost(input: CreatePostInput!): Post!
  deletePost(id: ID!): Boolean!
}
