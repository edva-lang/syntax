[package]
name = "gallery-engine"
version = "0.2.0"
edition = "2021"
authors = ["Antigravity Developer <dev@example.org>"]
description = "High-performance code parser and AST renderer"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "lexer_bench"
harness = false
